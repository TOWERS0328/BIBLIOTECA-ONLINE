<div class="libros-container">

  <h1>Biblioteca</h1>

  <!-- BUSCADOR -->
  <div class="buscador">
    <input
      type="text"
      placeholder="Buscar libro por título..."
      [(ngModel)]="busqueda"
    >
  </div>

  <div class="libros-grid">

    <div class="libro-card" *ngFor="let libro of libros">

      <h3>{{ libro.titulo }}</h3>

      <p><strong>Autor:</strong> {{ libro.autor }}</p>

      <p><strong>Editorial:</strong> {{ libro.editorial }}</p>

      <p><strong>Año:</strong> {{ libro.anio }}</p>

      <p class="categoria">
        {{ libro.categoria }}
      </p>

      <p class="disponible" *ngIf="libro.disponible">
        Disponible
      </p>

      <p class="no-disponible" *ngIf="!libro.disponible">
        No disponible
      </p>

      <button [routerLink]="['/libros', libro.id]">
        Ver detalle
      </button>

    </div>

  </div>

</div>
