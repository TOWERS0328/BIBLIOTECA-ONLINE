<div class="container py-4">

<h2>
<i class="bi bi-clock-history"></i>
Gestión de Préstamos
</h2>

<!-- BOTON NUEVO PRESTAMO -->

<div class="d-flex justify-content-end mt-3 mb-3">

<button
class="btn btn-success"
(click)="abrirNuevoPrestamo()"
data-bs-toggle="modal"
data-bs-target="#modalPrestamo"
title="Registrar nuevo préstamo">

<i class="bi bi-plus-circle"></i>
Nuevo préstamo

</button>

</div>

<!-- TABLA -->

<div class="table-responsive">

<table class="table table-striped table-hover">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Usuario</th>
<th>Tipo</th>
<th>Libro</th>
<th>Fecha préstamo</th>
<th>Fecha devolución</th>
<th>Estado</th>
<th>Acciones</th>

</tr>

</thead>

<tbody>

<tr *ngFor="let prestamo of prestamos">

<td>{{ prestamo.id }}</td>

<td>{{ prestamo.usuario }}</td>

<td>

<span
class="badge"
[ngClass]="{
'bg-primary': prestamo.tipoUsuario === 'ESTUDIANTE',
'bg-success': prestamo.tipoUsuario === 'DOCENTE'
}">

{{ prestamo.tipoUsuario }}

</span>

</td>

<td>{{ prestamo.libro }}</td>

<td>{{ prestamo.fechaPrestamo }}</td>

<td>{{ prestamo.fechaDevolucion }}</td>

<td>

<span
class="badge"
[ngClass]="{
'bg-warning': prestamo.estado === 'Activo',
'bg-success': prestamo.estado === 'Devuelto',
'bg-danger': prestamo.estado === 'Atrasado'
}">

{{ prestamo.estado }}

</span>

</td>

<td>

<button
class="btn btn-sm btn-primary me-2"
(click)="editarPrestamo(prestamo)"
data-bs-toggle="modal"
data-bs-target="#modalPrestamo"
title="Editar préstamo"
aria-label="Editar préstamo">

<i class="bi bi-pencil"></i>

</button>

<button
class="btn btn-sm btn-danger"
(click)="eliminarPrestamo(prestamo.id)"
title="Eliminar préstamo"
aria-label="Eliminar préstamo">

<i class="bi bi-trash"></i>

</button>

</td>

</tr>

</tbody>

</table>

</div>

</div>

<!-- MODAL PRESTAMO -->

<div
class="modal fade"
id="modalPrestamo"
tabindex="-1">

<div class="modal-dialog">

<div class="modal-content">

<!-- HEADER -->

<div class="modal-header">

<h5 class="modal-title">
<i class="bi bi-book"></i>
Registrar préstamo
</h5>

<button
class="btn-close"
data-bs-dismiss="modal"
title="Cerrar"
aria-label="Cerrar">
</button>

</div>

<!-- BODY -->
<div class="modal-body">

<div class="mb-3">

<label for="usuario" class="form-label">
Usuario
</label>

<select
id="usuario"
class="form-select"
[(ngModel)]="prestamoSeleccionado.usuarioId"
name="usuario">

<option *ngFor="let u of usuarios" [value]="u.id">
{{ u.nombre }} - {{ u.rol }}
</option>

</select>

</div>

<div class="mb-3">

<label for="libro" class="form-label">
Libro
</label>

<select
id="libro"
class="form-select"
[(ngModel)]="prestamoSeleccionado.libroId"
name="libro">

<option *ngFor="let l of libros" [value]="l.id">
{{ l.titulo }}
</option>

</select>

</div>

<div class="mb-3">

<label for="fechaPrestamo" class="form-label">
Fecha préstamo
</label>

<input
id="fechaPrestamo"
type="date"
class="form-control"
[(ngModel)]="prestamoSeleccionado.fechaPrestamo"
name="fechaPrestamo">

</div>

<div class="mb-3">

<label for="fechaDevolucion" class="form-label">
Fecha devolución
</label>

<input
id="fechaDevolucion"
type="date"
class="form-control"
[(ngModel)]="prestamoSeleccionado.fechaDevolucion"
name="fechaDevolucion">

</div>

<div class="mb-3">

<label for="estado" class="form-label">
Estado
</label>

<select
id="estado"
class="form-select"
[(ngModel)]="prestamoSeleccionado.estado"
name="estado">

<option>Activo</option>
<option>Devuelto</option>
<option>Atrasado</option>

</select>

</div>

</div>

<!-- FOOTER -->

<div class="modal-footer">

<button
class="btn btn-secondary"
data-bs-dismiss="modal"
title="Cancelar registro">

Cancelar

</button>

<button
class="btn btn-success"
(click)="guardarPrestamo()"
title="Guardar préstamo">

Guardar

</button>

</div>

</div>

</div>

</div>
